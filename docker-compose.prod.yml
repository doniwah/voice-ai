services:
  # --------------------------------------------------------------------------
  # 1. PostgreSQL 16 — Relational Database (Clinical Records, Audit Trail)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soapi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soapi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-soapi_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/server/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soapi_user} -d ${POSTGRES_DB:-soapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. S3 Object Storage — Medical Voice Recordings (Local S3 Storage)
  # --------------------------------------------------------------------------
  s3:
    image: adobe/s3mock:latest
    container_name: soapi-s3
    restart: always
    environment:
      - initialBuckets=${S3_BUCKET_NAME:-soapi-audio-recordings}
    ports:
      - "127.0.0.1:9000:9090"

  # --------------------------------------------------------------------------
  # 3. FastAPI Clinical AI Backend (RAG ICD-10 & ICD-9, SOAP Extraction)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soapi-backend
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PYTHONUNBUFFERED=1
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres

  # --------------------------------------------------------------------------
  # 4. Web Application (TanStack Start / Nitro SSR Frontend & API Gateway)
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soapi-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-soapi_user}:${POSTGRES_PASSWORD:-soapi_secret}@postgres:5432/${POSTGRES_DB:-soapi_db}
      - S3_ENDPOINT=http://s3:9090
      - S3_REGION=${S3_REGION:-ap-southeast-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-test}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-test}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-soapi-audio-recordings}
      - S3_FORCE_PATH_STYLE=true
      - FASTAPI_URL=http://backend:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
