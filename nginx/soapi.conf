# ==============================================================================
# Nginx Configuration for SOAPI EHR / Clinical AI
# Lokasi di VPS: /etc/nginx/sites-available/soapi
# Aktifkan: sudo ln -s /etc/nginx/sites-available/soapi /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Redirect HTTP ke HTTPS (Aktifkan setelah setup SSL Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Ganti dengan domain/IP VPS Anda

    # Izinkan verifikasi Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server Blok HTTPS (Produksi)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com; # Ganti dengan domain Anda

    # Sertifikat SSL Let's Encrypt (dihasilkan otomatis oleh certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Ukuran maksimum body untuk upload rekaman suara medis (audio wav/webm)
    client_max_body_size 50M;

    # Gzip Compression untuk performa cepat
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy Utama ke Aplikasi Web TanStack Start (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout untuk proses LLM / Whisper transkrip audio
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }

    # Proxy Opsional Langsung ke FastAPI Backend (Port 8000) jika ingin akses Swagger /docs
    location /fastapi/ {
        rewrite ^/fastapi/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
